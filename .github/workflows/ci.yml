name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caviar
          POSTGRES_PASSWORD: caviar_password
          POSTGRES_DB: caviar_beauty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caviar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://caviar:caviar_password@localhost:5432/caviar_beauty_test?schema=public
          DIRECT_URL: postgresql://caviar:caviar_password@localhost:5432/caviar_beauty_test?schema=public
      - run: npm test
        env:
          DATABASE_URL: postgresql://caviar:caviar_password@localhost:5432/caviar_beauty_test?schema=public
          DIRECT_URL: postgresql://caviar:caviar_password@localhost:5432/caviar_beauty_test?schema=public
